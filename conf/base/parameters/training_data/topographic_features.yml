topographic_features:
  dem_asset: USGS/SRTMGL1_003
  elevation_band: elevation
  output_bands: {elevation: DEM, slope: SLOPE}
  target_crs: EPSG:9377
  download:
    enabled: true
    output_dir: data/04_feature/sentinel2_bands
    source_file: Topography_DEM_SLOPE_raw.tif
    scale: 30
    # Earth Engine descarga SRTM en CRS geografico; luego rasterio lo alinea a EPSG:9377.
    crs: EPSG:4326
    format: GEO_TIFF
    timeout_seconds: 300
  alignment:
    reference_raster: data/04_feature/sentinel2_bands/Sentinel2_B2_Masked.tif
    output_file_template: Topography_{band}.tif
    resampling: bilinear
    nodata_value: -9999.0
  map_plots:
    output_dir: data/08_reporting/topographic_features
    figure_size: [10, 8]
    dpi: 220
    percentile_clip: [2, 98]
    x_label: Coordenada X (EPSG:9377)
    y_label: Coordenada Y (EPSG:9377)
    layers:
      - band: DEM
        output_path: data/08_reporting/topographic_features/topography_dem_map.png
        title: Modelo digital de elevacion (DEM)
        colorbar_label: Elevacion (m s. n. m.)
        cmap: terrain
      - band: SLOPE
        output_path: data/08_reporting/topographic_features/topography_slope_map.png
        title: Pendiente derivada del DEM
        colorbar_label: Pendiente (grados)
        cmap: magma
