mining_multiclass_random_forest:
  label_column: Cobertura
  target_column: target_class
  prediction_column: predicted_class
  probability_prefix: probability
  class_labels: [Bosque Natural, Cuerpos de Agua, Mineria, Nubes, Suelo Desnudo, Vegetacion]
  class_values: {Bosque Natural: 1, Cuerpos de Agua: 2, Mineria: 3, Nubes: 4, Suelo Desnudo: 5, Vegetacion: 6}
  feature_columns: [B1, B2, B3, B4, B5, B6, B7, B8, B8A, B9, B11, NDVI, MSAVI, NDWI, BSI, MBSI, NDSI, NDBI]
  random_forest:
    n_estimators: 500
    criterion: gini
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: sqrt
    bootstrap: true
    class_weight: balanced
    random_state: 42
    n_jobs: 1
  confusion_matrix_plot:
    output_path: data/08_reporting/train_mining_multiclass_rf/mining_multiclass_confusion_matrix.png
    title: Matriz de confusion - coberturas
    x_label: Prediccion
    y_label: Observado
    figure_size: [8, 7]
    dpi: 160
    cmap: Blues
  feature_importance_plot:
    output_path: data/08_reporting/train_mining_multiclass_rf/mining_multiclass_feature_importance.png
    title: Importancia de variables - Random Forest multiclase
    x_label: Importancia
    figure_size: [8, 7]
    dpi: 160
    top_n: 20
    color: "#1379B9"
