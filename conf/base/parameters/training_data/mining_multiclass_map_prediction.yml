mining_multiclass_map_prediction:
  raster_dir: data/04_feature/sentinel2_bands
  band_file_template: Sentinel2_{band}_Masked.tif
  reference_band: B2
  bands: [B2, B3, B4, B5, B6, B7, B8, B8A, B11]
  topographic_rasters: {DEM: Topography_DEM.tif, SLOPE: Topography_SLOPE.tif}
  feature_columns: [B2, B3, B4, B5, B6, B7, B8, B8A, B11, NDVI, MSAVI, NDWI, BSI, MBSI, NDSI, NDBI, DEM, SLOPE]
  class_values: {Bosque Natural: 1, Cuerpos de Agua: 2, Mineria: 3, Nubes: 4, Suelo Desnudo: 5, Vegetacion: 6}
  class_nodata: 255
  probability_nodata: -9999.0
  apply_reflectance_scale: true
  reflectance_scale_factor: 0.0001
  window_size: 512
  outputs:
    classification_map: data/07_model_output/mining_multiclass_classification_map.tif
    probability_max_map: data/07_model_output/mining_multiclass_probability_max_map.tif
  visualization:
    output_path: data/08_reporting/predict_mining_multiclass_map/mining_multiclass_classification_map.png
    title: Mapa multiclase de coberturas
    figure_size: [9, 9]
    dpi: 160
    colors:
      Bosque Natural: "#1B5E20"
      Cuerpos de Agua: "#1565C0"
      Mineria: "#D32F2F"
      Nubes: "#616161"
      Suelo Desnudo: "#F28E2B"
      Vegetacion: "#43A047"
